<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MemVane — Local Web Dashboard Prototype</title>
<style>
  :root {
    --bg-app: #0b0e14;
    --bg-sidebar: #10141c;
    --bg-surface: #151a24;
    --bg-surface-2: #1b2230;
    --bg-hover: #21293a;
    --bg-input: #0e121a;
    --border: #263042;
    --border-strong: #36445d;
    --text-primary: #e6edf7;
    --text-secondary: #9aa7bd;
    --text-muted: #66758f;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, 0.14);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.14);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.14);
    --red: #f43f5e;
    --red-soft: rgba(244, 63, 94, 0.14);
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, 0.14);
    --pin-bg: #ff5c39;
    --pin-resolved: #475569;
    --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.52);
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.28);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  [data-theme="light"] {
    --bg-app: #f4f6fa;
    --bg-sidebar: #ffffff;
    --bg-surface: #ffffff;
    --bg-surface-2: #f8fafc;
    --bg-hover: #eef2f7;
    --bg-input: #f1f5f9;
    --border: #dce3ee;
    --border-strong: #c2cede;
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #7c8798;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.10);
    --green: #16a34a;
    --green-soft: rgba(22, 163, 74, 0.11);
    --amber: #d97706;
    --amber-soft: rgba(217, 119, 6, 0.12);
    --red: #e11d48;
    --red-soft: rgba(225, 29, 72, 0.10);
    --purple: #7c3aed;
    --purple-soft: rgba(124, 58, 237, 0.10);
    --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.14);
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; line-height: 1.45; overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  /* App Grid */
  .app-shell {
    display: grid;
    grid-template-columns: 268px 1fr;
    grid-template-rows: 50px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* Topbar */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    min-width: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand {
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em; padding-right: 10px; border-right: 1px solid var(--border); white-space: nowrap;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--purple)); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800;
  }
  .breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumb strong { color: var(--text-primary); font-weight: 600; }

  .tab-nav { display: flex; align-items: center; gap: 3px; background: var(--bg-input); padding: 3px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .tab-btn {
    border: none; background: transparent; color: var(--text-secondary); padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: 500; transition: all .15s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
  .tab-btn.active { background: var(--bg-surface-2); color: var(--text-primary); box-shadow: var(--shadow-sm); border: 1px solid var(--border-strong); }

  .topbar-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); background: var(--bg-surface-2); color: var(--text-secondary); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); }
  .dot.blue { background: var(--accent); }
  .dot.muted { background: var(--text-muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-surface-2); color: var(--text-primary); font-size: 12px; font-weight: 500; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn-comment.active { background: var(--pin-bg); border-color: var(--pin-bg); color: #fff; box-shadow: 0 0 0 3px rgba(255, 92, 57, 0.25); }
  .btn-labels.active { background: var(--purple); border-color: var(--purple); color: #fff; }
  .btn-sm { padding: 3px 8px; font-size: 11px; }
  .btn-danger { color: var(--red); border-color: rgba(244, 63, 94, 0.35); }
  .btn-danger:hover { background: var(--red-soft); }

  /* Sidebar (Orca style) */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-search { padding: 10px; border-bottom: 1px solid var(--border); }
  .sidebar-search input {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 9px; font-size: 12px; outline: none;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-section-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 10px 8px 4px; display: flex; justify-content: space-between; align-items: center;
  }
  .tree-item {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 2px; border: 1px solid transparent;
  }
  .tree-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tree-item.active { background: var(--accent-soft); color: var(--text-primary); border-color: rgba(76, 141, 255, 0.35); font-weight: 600; }
  .tree-item-main { display: flex; align-items: flex-start; gap: 7px; min-width: 0; flex: 1; }
  .tree-item-main .dot { margin-top: 5px; }
  .tree-item-text { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
  .tree-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-branch {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1.25; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; font-weight: 400;
  }
  .tree-item.active .tree-branch { color: var(--text-secondary); }
  .tree-toggle { width: 16px; height: 16px; margin-top: 1px; display: grid; place-items: center; border-radius: 4px; color: var(--text-muted); flex-shrink: 0; border: none; background: transparent; padding: 0; }
  .tree-toggle:hover { background: var(--bg-surface-2); color: var(--text-primary); }
  .tree-children { margin-left: 14px; padding-left: 8px; border-left: 1px solid var(--border); margin-bottom: 4px; }
  .tree-wt { font-size: 12px; padding: 5px 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
  }
  .badge-green { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.25); }
  .badge-amber { background: var(--amber-soft); color: var(--amber); border-color: rgba(245, 158, 11, 0.28); }
  .badge-red { background: var(--red-soft); color: var(--red); border-color: rgba(244, 63, 94, 0.28); }
  .badge-blue { background: var(--accent-soft); color: var(--accent); border-color: rgba(76, 141, 255, 0.28); }
  .badge-purple { background: var(--purple-soft); color: var(--purple); border-color: rgba(167, 139, 250, 0.28); }
  .badge-muted { background: var(--bg-surface-2); color: var(--text-secondary); border-color: var(--border); }

  /* Main Workspace */
  .main-wrap {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .comment-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: linear-gradient(90deg, rgba(255, 92, 57, 0.18), rgba(76, 141, 255, 0.14));
    border-bottom: 1px solid rgba(255, 92, 57, 0.45);
    font-size: 12px;
    color: var(--text-primary);
    flex-shrink: 0;
  }
  body.comment-mode .comment-banner { display: flex; }
  body.comment-mode { cursor: crosshair; }

  .main-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Cards & Panels */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .card-title { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .card-sub { font-size: 11.5px; color: var(--text-secondary); }

  .alert-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md); background: var(--amber-soft); border: 1px solid rgba(245, 158, 11, 0.35); color: var(--text-primary);
  }
  .alert-banner-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
  .kpi-label { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-foot { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 7px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.clickable:hover td { background: var(--bg-hover); cursor: pointer; }
  tr.wt-row td:first-child { padding-left: 26px; color: var(--text-secondary); }
  tr.selected-row td { background: var(--accent-soft); }

  /* Two-column / grids */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .split-wiki { display: grid; grid-template-columns: 310px 1fr; gap: 12px; min-height: 520px; }
  .split-source { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Playground */
  .query-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .query-input {
    flex: 1; min-width: 240px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; font-size: 13px; outline: none;
  }
  .query-input:focus { border-color: var(--accent); }
  .stage-col { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .stage-title { font-size: 11.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .cand-item { padding: 7px 8px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border); font-size: 11.5px; display: flex; flex-direction: column; gap: 3px; }
  .cand-item.picked { border-color: var(--green); background: var(--green-soft); }
  .cand-item.dropped { opacity: 0.72; }

  /* Stage timing bar */
  .timing-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--bg-input); border: 1px solid var(--border); margin: 6px 0; }
  .t-seg { height: 100%; }

  /* Progress Bars */
  .prog-track { height: 7px; border-radius: 999px; background: var(--bg-input); border: 1px solid var(--border); overflow: hidden; display: flex; }
  .prog-fill { height: 100%; }

  /* Wiki Card & Source */
  .wiki-item { padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-surface-2); cursor: pointer; margin-bottom: 6px; }
  .wiki-item:hover { border-color: var(--border-strong); background: var(--bg-hover); }
  .wiki-item.active { border-color: var(--accent); background: var(--accent-soft); }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-surface-2); font-size: 11.5px; color: var(--text-secondary); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text-primary); font-weight: 600; }

  .code-block {
    background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; overflow-x: auto; white-space: pre-wrap;
  }
  .source-line { display: flex; gap: 10px; padding: 1px 6px; border-radius: 3px; }
  .source-line.hl { background: rgba(76, 141, 255, 0.18); border-left: 2px solid var(--accent); }
  .line-no { color: var(--text-muted); user-select: none; min-width: 28px; text-align: right; }

  .auto-block { border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; background: rgba(76, 141, 255, 0.05); padding: 8px 10px; border-radius: 0 6px 6px 0; }
  .manual-block { border-left: 3px solid var(--green); padding-left: 10px; margin: 8px 0; background: rgba(34, 197, 94, 0.05); padding: 8px 10px; border-radius: 0 6px 6px 0; }

  /* Comment Pins, Region Highlight, Overlay Badges & Drawer */
  [data-region] { transition: outline-color .12s, box-shadow .12s; }
  body.comment-mode [data-region].region-hover {
    outline: 2px dashed var(--pin-bg) !important;
    outline-offset: 2px;
  }
  .region-pulse {
    animation: regionPulse 1.4s ease-out;
  }
  @keyframes regionPulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 92, 57, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(255, 92, 57, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 92, 57, 0); }
  }

  .overlay-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
  }
  .region-badge {
    position: fixed;
    pointer-events: none;
    background: var(--purple);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
    z-index: 61;
  }
  .pin-marker {
    position: fixed;
    pointer-events: auto;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    background: var(--pin-bg);
    color: #fff;
    border: 2px solid #fff;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    z-index: 65;
  }
  .pin-marker span { transform: rotate(45deg); display: block; line-height: 1; }
  .pin-marker.resolved { background: var(--pin-resolved); opacity: 0.78; }
  .pin-marker:hover { transform: rotate(-45deg) scale(1.12); }

  /* Popover */
  .popover {
    position: fixed;
    width: 320px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 12px;
    z-index: 80;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .popover.open { display: flex; }
  .cat-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .cat-chip { padding: 2px 7px; font-size: 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-surface-2); color: var(--text-secondary); }
  .cat-chip.active { background: var(--pin-bg); border-color: var(--pin-bg); color: #fff; font-weight: 600; }
  .popover textarea {
    width: 100%; min-height: 76px; resize: vertical; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 9px; font-size: 12.5px; outline: none;
  }
  .popover textarea:focus { border-color: var(--accent); }

  /* Comment Drawer */
  .drawer {
    position: fixed;
    top: 50px;
    right: 0;
    bottom: 0;
    width: 360px;
    background: var(--bg-sidebar);
    border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow-lg);
    z-index: 70;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .18s ease-out;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .drawer-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .comment-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer;
  }
  .comment-card:hover { border-color: var(--accent); }
  .comment-card.resolved { opacity: 0.65; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.58); display: none; place-items: center; z-index: 95;
  }
  .modal-backdrop.open { display: grid; }
  .modal {
    width: min(520px, 92vw); background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 10px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-surface-2); border: 1px solid var(--border-strong); color: var(--text-primary);
    padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: all .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1080px) {
    .kpi-grid, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split-wiki, .split-source, .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- TOPBAR -->
  <header class="topbar" data-region="T1-topbar" data-region-label="상단 글로벌 상태바 & 탭">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark">M</span>
        <span>MemVane</span>
      </div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <nav class="tab-nav" id="tabNav" aria-label="Primary Tabs">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="recall">Recall &amp; Playground</button>
        <button class="tab-btn" data-tab="wiki">Wiki Browser</button>
        <button class="tab-btn" data-tab="runtime">Runtime &amp; Learning</button>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="pill" title="BroadcastChannel 단일 SSE 리더"><span class="dot green"></span>SSE Leader · 1 tab</span>

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.comments)) state.comments = parsed.comments;
      if (parsed.theme === 'light' || parsed.theme === 'dark') state.theme = parsed.theme;
    } catch { /* ignore */ }
  }
  function saveStore() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ theme: state.theme, comments: state.comments }));
    } catch { /* ignore */ }
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function currentTarget() {
    if (state.selectedTargetId === 'ALL') return null;
    return TARGETS.find(t => t.targetId === state.selectedTargetId) || null;
  }

  function contextLabel() {
    const t = currentTarget();
    if (!t) return 'All Projects';
    if (t.kind === 'worktree') {
      const parent = TARGETS.find(p => p.targetId === t.parentId);
      return (parent ? parent.name : '') + ' > ' + t.name;
    }
    return t.name + ' (main)';
  }

      const p = TARGETS.find(x => x.targetId === t.parentId);

    for (const m of mains) {

      const matchMain = !q || m.name.toLowerCase().includes(q) || m.branch.toLowerCase().includes(q);
      const matchedWts = wts.filter(w => !q || w.name.toLowerCase().includes(q) || w.branch.toLowerCase().includes(q));

      const expanded = state.expandedMains.has(m.targetId) || Boolean(q);

      html += `

  function renderWiki() {
    const t = currentTarget();
    const cards = WIKI_CARDS.filter(c => {
      if (t && c.targetId !== t.targetId && (!t.parentId || c.targetId !== t.parentId)) {
        if (!(t.kind === 'main' && c.targetId === t.targetId)) return false;
      }
      if (state.wikiFilter === 'verified' && c.status !== 'verified') return false;
      if (state.wikiFilter === 'generated' && c.status !== 'generated') return false;
      if (state.wikiFilter === 'pending' && c.status !== 'pending_replace') return false;
      if (state.wikiFilter === 'stale' && !c.stale) return false;
      if (state.wikiFilter === 'over_budget' && c.tokens <= c.budget) return false;
      if (state.wikiSearch.trim()) {
        const q = state.wikiSearch.trim().toLowerCase();
        if (!c.title.toLowerCase().includes(q) && !c.rel.toLowerCase().includes(q)) return false;
      }
      return true;
    });
    const activeCard = cards.find(c => c.rel === state.selectedCardRel) || cards[0] || WIKI_CARDS[0];

    const statusBadge = st => {
      if (st === 'verified') return '<span class="badge badge-green">verified</span>';
      if (st === 'generated') return '<span class="badge badge-amber">generated (비가시)</span>';
      return '<span class="badge badge-purple">pending 교체 대기</span>';

            </label>
            <div class="card-sub">적용 범위: 온보딩된 프로젝트·워크트리 세션 시작 시 (<code class="mono">onboarded_sessions</code>, Phase 1 확정)</div>
            <div class="card-sub mono">idleShutdown: 30m · autoOpenCooldown: 240m · reconnectGrace: 10s</div>
          </div>
        </section>
      </div>
    `;
  }

  function renderMain() {
    const main = document.getElementById('mainContent');
    if (state.tab === 'overview') main.innerHTML = renderOverview();
    else if (state.tab === 'recall') main.innerHTML = renderRecall();
    else if (state.tab === 'wiki') main.innerHTML = renderWiki();
    else main.innerHTML = renderRuntime();
    requestAnimationFrame(renderOverlay);
  }

  // ---------------- Comment Pins & Region Badges Overlay ----------------
  function renderOverlay() {
    const layer = document.getElementById('overlayLayer');
    layer.innerHTML = '';

    // Region ID labels ([L])
    if (state.showLabels) {
      document.querySelectorAll('[data-region]').forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const badge = document.createElement('div');
        badge.className = 'region-badge';
        badge.textContent = el.dataset.region;
        badge.style.left = Math.max(4, rect.left + 6) + 'px';
        badge.style.top = Math.max(54, rect.top - 8) + 'px';
        layer.appendChild(badge);
      });
    }

    // Comment pins visible in current tab (or shell chrome T1/S1)
    const visibleComments = state.comments.filter(c => c.tab === state.tab || c.regionId.startsWith('T') || c.regionId.startsWith('S'));
    visibleComments.forEach((c) => {
      const idx = state.comments.findIndex(x => x.id === c.id) + 1;
      const targetEl = document.querySelector(`[data-region="${c.regionId}"]`);
      if (!targetEl) return;
      const rect = targetEl.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      // Clip pins inside scroll viewport
      const px = rect.left + (c.xPct / 100) * rect.width;
      const py = rect.top + (c.yPct / 100) * rect.height;
      if (py < 48 || py > window.innerHeight - 6) return;

      const pin = document.createElement('button');
      pin.className = 'pin-marker' + (c.resolved ? ' resolved' : '');
      pin.style.left = px + 'px';
      pin.style.top = py + 'px';
      pin.title = `[${c.category}] ${c.text}`;
      const span = document.createElement('span');
      span.textContent = c.resolved ? '✓' : String(idx);
      pin.appendChild(span);
      pin.addEventListener('click', (ev) => {
        ev.stopPropagation();
        openPopoverForExisting(c.id, px, py);
      });
      layer.appendChild(pin);
    });
  }

  // ---------------- Comment Popover & Drawer ----------------
  const popover = document.getElementById('commentPopover');
  let selectedCat = CATEGORIES[0];

  function renderPopCats() {
    const wrap = document.getElementById('popCats');
    wrap.innerHTML = CATEGORIES.map(cat => `<button type="button" class="cat-chip ${selectedCat === cat ? 'active' : ''}" data-cat="${esc(cat)}">${esc(cat)}</button>`).join('');
  }

  function placePopover(x, y) {
    const left = Math.min(window.innerWidth - 336, Math.max(12, x + 14));
    const top = Math.min(window.innerHeight - 250, Math.max(58, y - 16));
    popover.style.left = left + 'px';
    popover.style.top = top + 'px';
  }

  function openPopoverForNew(regionId, regionLabel, xPct, yPct, clientX, clientY) {
    state.activeEditId = null;
    state.pendingPin = { regionId, regionLabel, xPct, yPct };
    selectedCat = CATEGORIES[0];
    document.getElementById('popTitle').textContent = '새 피드백 코멘트';
    document.getElementById('popRegion').textContent = regionId;
    document.getElementById('popText').value = '';
    document.getElementById('popEditActions').innerHTML = '';
    renderPopCats();
    placePopover(clientX, clientY);
    popover.classList.add('open');
    document.getElementById('popText').focus();
  }

  function openPopoverForExisting(commentId, x, y) {
    const c = state.comments.find(item => item.id === commentId);
    if (!c) return;
    state.activeEditId = c.id;
    state.pendingPin = null;
    selectedCat = c.category;
    document.getElementById('popTitle').textContent = '코멘트 편집 #' + (state.comments.indexOf(c) + 1);
    document.getElementById('popRegion').textContent = c.regionId;
    document.getElementById('popText').value = c.text;
    document.getElementById('popEditActions').innerHTML = `
      <button type="button" class="btn btn-sm" id="popResolveBtn">${c.resolved ? '미해결로' : '해결됨'}</button>
      <button type="button" class="btn btn-sm btn-danger" id="popDeleteBtn">삭제</button>
    `;
    renderPopCats();
    placePopover(x, y);
    popover.classList.add('open');
    document.getElementById('popResolveBtn').onclick = () => {
      c.resolved = !c.resolved;
      saveStore(); closePopover(); renderTopbar(); renderOverlay(); renderDrawer();
    };
    document.getElementById('popDeleteBtn').onclick = () => {
      state.comments = state.comments.filter(item => item.id !== c.id);
      saveStore(); closePopover(); renderTopbar(); renderOverlay(); renderDrawer();
    };
  }

  function closePopover() {
    popover.classList.remove('open');
    state.activeEditId = null;
    state.pendingPin = null;
  }

  function savePopover() {
    const text = document.getElementById('popText').value.trim();
    if (!text) { showToast('코멘트 내용을 입력해 주세요.'); return; }
    if (state.activeEditId) {
      const c = state.comments.find(item => item.id === state.activeEditId);
      if (c) { c.category = selectedCat; c.text = text; }
    } else if (state.pendingPin) {
      state.comments.push({
        id: 'c_' + Date.now() + '_' + Math.random().toString(16).slice(2, 6),
        tab: state.tab,
        context: contextLabel(),
        targetId: state.selectedTargetId,
        regionId: state.pendingPin.regionId,
        regionLabel: state.pendingPin.regionLabel,
        xPct: state.pendingPin.xPct,
        yPct: state.pendingPin.yPct,
        category: selectedCat,
        text,
        resolved: false,
        createdAt: new Date().toLocaleTimeString('ko-KR', { hour12: false })
      });
    }
    saveStore();
    closePopover();
    renderTopbar();
    renderOverlay();
    renderDrawer();
    showToast('코멘트가 저장되었습니다.');
  }

  function renderDrawer() {
    const list = document.getElementById('drawerList');
    document.querySelectorAll('#drawerFilters .chip').forEach(ch => ch.classList.toggle('active', ch.dataset.filter === state.drawerFilter));
    const filtered = state.comments.filter(c => {
      if (state.drawerFilter === 'tab') return c.tab === state.tab;
      if (state.drawerFilter === 'open') return !c.resolved;
      return true;
    });
    if (!filtered.length) {
      list.innerHTML = `<div class="card-sub" style="padding:18px;text-align:center;">남긴 코멘트가 없습니다.<br/>상단 <strong>코멘트 달기 [C]</strong>를 눌러 화면을 클릭해 보세요.</div>`;
      return;
    }
    list.innerHTML = filtered.map(c => {
      const idx = state.comments.indexOf(c) + 1;
      return `
        <div class="comment-card ${c.resolved ? 'resolved' : ''}" data-jump-comment="${esc(c.id)}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span class="badge ${c.resolved ? 'badge-muted' : 'badge-red'}">#${idx} ${esc(c.category)}</span>
            <span class="mono" style="font-size:10.5px;color:var(--text-muted);">${esc(c.tab)} · ${esc(c.regionId)}</span>
          </div>
          <div style="font-size:12.5px;white-space:pre-wrap;">${esc(c.text)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);">
            <span>${esc(c.context)}</span>
            <span>${esc(c.createdAt)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function buildMarkdownExport() {
    if (!state.comments.length) return '## MemVane UI 가안 피드백\n\n(남긴 코멘트 없음)\n';
    const lines = ['## MemVane UI 가안 피드백', ''];
    state.comments.forEach((c, i) => {
      const status = c.resolved ? '[해결됨] ' : '';
      lines.push(`${i + 1}. ${status}**[${c.category}] [${c.tab} > ${c.regionId}]** (컨텍스트: ${c.context})`);
      lines.push(`   - ${c.text.replace(/\n/g, '\n   - ')}`);
    });
    return lines.join('\n') + '\n';
  }

  function openModal(title, bodyHtml, footerHtml) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || '';
    document.getElementById('modalBackdrop').classList.add('open');
  }

  // ---------------- Event Wiring ----------------
  document.getElementById('tabNav').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    state.tab = btn.dataset.tab;
    closePopover();
    renderTopbar(); renderMain(); renderDrawer();
  });

  document.getElementById('sidebarSearch').addEventListener('input', (e) => {
    state.sidebarQuery = e.target.value;
    renderSidebar();
  });

  document.getElementById('sidebarTree').addEventListener('click', (e) => {
    if (state.commentMode) return;
    const tog = e.target.closest('[data-toggle-main]');
    if (tog) {
      e.stopPropagation();
      const id = tog.dataset.toggleMain;
      if (state.expandedMains.has(id)) state.expandedMains.delete(id); else state.expandedMains.add(id);
      renderSidebar();
      return;
    }
    const sel = e.target.closest('[data-select-target]');
    if (sel) {
      state.selectedTargetId = sel.dataset.selectTarget;
      renderTopbar(); renderSidebar(); renderMain();
    }
  });

  document.getElementById('mainContent').addEventListener('click', (e) => {
    if (state.commentMode) return;
    const targetBtn = e.target.closest('[data-select-target]');
    if (targetBtn) {
      state.selectedTargetId = targetBtn.dataset.selectTarget;
      renderTopbar(); renderSidebar(); renderMain(); return;
    }
    const jumpTab = e.target.closest('[data-jump-tab]');
    if (jumpTab) { state.tab = jumpTab.dataset.jumpTab; renderTopbar(); renderMain(); return; }
    const errBtn = e.target.closest('[data-toggle-err]');
    if (errBtn) {
      const id = errBtn.dataset.toggleErr;
      state.showErrorDetailId = state.showErrorDetailId === id ? null : id;
      renderMain(); return;
    }
    if (e.target.id === 'reconcileBtn') { showToast('reconcile=True 실행 완료 (32행 예산 내 5개 체크아웃 확인)'); return; }
    const presetBtn = e.target.closest('[data-preset-idx]');
    if (presetBtn) {
      const keys = Object.keys(PLAYGROUND_PRESETS);
      state.playgroundQuery = keys[Number(presetBtn.dataset.presetIdx)] || keys[0];
      state.playgroundResult = PLAYGROUND_PRESETS[state.playgroundQuery];
      renderMain(); return;
    }
    if (e.target.id === 'pgRunBtn') {
      const q = (document.getElementById('pgInput') || {}).value || state.playgroundQuery;
      state.playgroundQuery = q;
      state.playgroundResult = PLAYGROUND_PRESETS[q] || PLAYGROUND_PRESETS[Object.keys(PLAYGROUND_PRESETS)[0]];
      showToast('Dry-Run 완료 (events.jsonl · 학습 DB 미기록)');
      renderMain(); return;
    }
    const hostChip = e.target.closest('[data-host-filter]');
    if (hostChip) { state.recallHostFilter = hostChip.dataset.hostFilter; renderMain(); return; }
    const recRow = e.target.closest('[data-select-recall]');
    if (recRow) { state.selectedRecallId = recRow.dataset.selectRecall; renderMain(); return; }
    const openCard = e.target.closest('[data-open-card]');
    if (openCard) {
      state.selectedCardRel = openCard.dataset.openCard;
      state.tab = 'wiki';
      renderTopbar(); renderMain(); renderDrawer(); return;
    }
    const wChip = e.target.closest('[data-wiki-filter]');
    if (wChip) { state.wikiFilter = wChip.dataset.wikiFilter; renderMain(); return; }
    const wCard = e.target.closest('[data-select-wiki]');
    if (wCard) { state.selectedCardRel = wCard.dataset.selectWiki; renderMain(); return; }
    if (e.target.id === 'toggleSourceBtn') { state.showSourceSplit = !state.showSourceSplit; renderMain(); return; }
    if (e.target.id === 'learningCheckBtn') {
      state.learningCheckResult = 'I-1..I-9, G-1, G-7: 0 violation(s) (read-only 확인)';
      renderMain(); return;
    }
    if (e.target.id === 'cleanupPreviewBtn') {
      openModal('State 정리 미리보기 (previewSha256)', `
        <div class="card-sub">Phase 2 제어 액션은 실제 삭제 전 대상 목록의 SHA-256을 확인합니다.</div>
        <div class="code-block" style="margin-top:8px;">previewSha256: 7f2c90e1a4b8...e912\nremove_installs: ["old-test-install-8812a"] (184 MB)\nremove_generations: ["v1.0.22-embed"] (128 MB)</div>
      `, '<button class="btn btn-sm btn-primary" onclick="document.getElementById(\'modalBackdrop\').classList.remove(\'open\')">확인 (모의 체험)</button>');
    }
  });

  document.getElementById('mainContent').addEventListener('change', (e) => {
    if (e.target.id === 'pgSemToggle') { state.playgroundSemantic = e.target.checked; renderMain(); }
    else if (e.target.id === 'pgSelToggle') { state.playgroundSelector = e.target.checked; renderMain(); }
    else if (e.target.id === 'prefAutoOpen') { state.autoOpenOnSessionStart = e.target.checked; showToast('preferences.json(모의) 갱신됨'); }
    else if (e.target.id === 'prefScope') { state.autoOpenScope = e.target.value; showToast('autoOpenScope: ' + state.autoOpenScope); }
  });
  document.getElementById('mainContent').addEventListener('input', (e) => {
    if (e.target.id === 'wikiSearchInput') { state.wikiSearch = e.target.value; renderMain(); }
  });

  // Topbar Controls
  document.getElementById('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveStore(); renderTopbar(); renderOverlay();
  });
  document.getElementById('labelsBtn').addEventListener('click', () => {
    state.showLabels = !state.showLabels;
    renderTopbar(); renderOverlay();
  });
  const toggleCommentMode = (force) => {
    state.commentMode = typeof force === 'boolean' ? force : !state.commentMode;
    document.querySelectorAll('.region-hover').forEach(el => el.classList.remove('region-hover'));
    if (!state.commentMode) closePopover();
    renderTopbar();
  };
  document.getElementById('commentModeBtn').addEventListener('click', () => toggleCommentMode());
  document.getElementById('exitCommentBtn').addEventListener('click', () => toggleCommentMode(false));

  document.getElementById('drawerBtn').addEventListener('click', () => {
    state.drawerOpen = !state.drawerOpen;
    document.getElementById('commentDrawer').classList.toggle('open', state.drawerOpen);
    renderDrawer();
  });
  document.getElementById('closeDrawerBtn').addEventListener('click', () => {
    state.drawerOpen = false;
    document.getElementById('commentDrawer').classList.remove('open');
  });

  // Comment Capture (Capture phase so it intercepts clicks cleanly in commentMode)
  let lastHoverRegion = null;
  document.addEventListener('mousemove', (e) => {
    if (!state.commentMode || popover.classList.contains('open')) return;
    const region = e.target.closest && e.target.closest('[data-region]');
    if (lastHoverRegion && lastHoverRegion !== region) lastHoverRegion.classList.remove('region-hover');
    if (region) region.classList.add('region-hover');
    lastHoverRegion = region;
  });

  document.addEventListener('click', (e) => {
    if (!state.commentMode) return;
    if (e.target.closest('#commentPopover, #commentDrawer, #modalBackdrop, #commentModeBtn, #exitCommentBtn, #labelsBtn, #drawerBtn, #themeBtn, .pin-marker')) return;
    const region = e.target.closest('[data-region]');
    if (!region) return;
    e.preventDefault();
    e.stopPropagation();
    const rect = region.getBoundingClientRect();
    const xPct = Math.min(97, Math.max(3, ((e.clientX - rect.left) / Math.max(1, rect.width)) * 100));
    const yPct = Math.min(96, Math.max(4, ((e.clientY - rect.top) / Math.max(1, rect.height)) * 100));
    openPopoverForNew(region.dataset.region, region.dataset.regionLabel || region.dataset.region, Number(xPct.toFixed(1)), Number(yPct.toFixed(1)), e.clientX, e.clientY);
  }, true);

  document.getElementById('popCats').addEventListener('click', (e) => {
    const ch = e.target.closest('[data-cat]');
    if (!ch) return;
    selectedCat = ch.dataset.cat;
    renderPopCats();
  });
  document.getElementById('popCancel').addEventListener('click', closePopover);
  document.getElementById('popSave').addEventListener('click', savePopover);
  document.getElementById('popText').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); savePopover(); }
    if (e.key === 'Escape') closePopover();
  });

  // Drawer actions
  document.getElementById('drawerFilters').addEventListener('click', (e) => {
    const ch = e.target.closest('[data-filter]');
    if (!ch) return;
    state.drawerFilter = ch.dataset.filter;
    renderDrawer();
  });
  document.getElementById('drawerList').addEventListener('click', (e) => {
    const card = e.target.closest('[data-jump-comment]');
    if (!card) return;
    const c = state.comments.find(x => x.id === card.dataset.jumpComment);
    if (!c) return;
    if (c.tab && c.tab !== state.tab) { state.tab = c.tab; renderTopbar(); renderMain(); }
    requestAnimationFrame(() => {
      const target = document.querySelector(`[data-region="${c.regionId}"]`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.remove('region-pulse');
        void target.offsetWidth;
        target.classList.add('region-pulse');
        setTimeout(renderOverlay, 250);
      }
    });
  });

  document.getElementById('copyMdBtn').addEventListener('click', async () => {
    const md = buildMarkdownExport();
    try {
      await navigator.clipboard.writeText(md);
      showToast('피드백 마크다운을 클립보드에 복사했습니다! 채팅창에 붙여넣으세요.');
    } catch {
      openModal('마크다운 수동 복사', `<textarea readonly style="width:100%;height:220px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:var(--font-mono);font-size:12px;">${esc(md)}</textarea>`);
    }
  });
  document.getElementById('downloadMdBtn').addEventListener('click', () => {
    const blob = new Blob([buildMarkdownExport()], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'memvane-ui-feedback.md';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!state.comments.length) return;
    state.comments = [];
    saveStore(); renderTopbar(); renderOverlay(); renderDrawer();
    showToast('모든 코멘트를 삭제했습니다.');
  });

  document.getElementById('modalCloseBtn').addEventListener('click', () => document.getElementById('modalBackdrop').classList.remove('open'));
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') document.getElementById('modalBackdrop').classList.remove('open');
  });

  // Keyboard shortcuts & Pin repositioning on scroll/resize
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (e.key === 'Escape') { closePopover(); e.target.blur(); }
      return;
    }
    if (e.key === 'c' || e.key === 'C') toggleCommentMode();
    else if (e.key === 'l' || e.key === 'L') { state.showLabels = !state.showLabels; renderTopbar(); renderOverlay(); }
    else if (e.key === 'Escape') { toggleCommentMode(false); document.getElementById('modalBackdrop').classList.remove('open'); }
  });
  document.getElementById('mainContent').addEventListener('scroll', () => requestAnimationFrame(renderOverlay));
  document.getElementById('sidebarTree').addEventListener('scroll', () => requestAnimationFrame(renderOverlay));
  window.addEventListener('resize', () => requestAnimationFrame(renderOverlay));

  // Init
  loadStore();
  renderTopbar();
  renderSidebar();
  renderMain();
  renderDrawer();
})();
</script>
</body>
</html>
