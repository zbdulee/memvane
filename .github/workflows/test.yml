name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref replaces the run still queued or in progress for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux: a pull request runs Node 22 only; a push to main runs every Node version.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[22, 24, 26]') }}
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags: the old-bundle compatibility tests extract
          # earlier releases from their tags (memvane/learning/tests/old_bundle_121.py).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify runtime prerequisites
        run: |
          node --version
          python3 --version
          bash --version
      - name: Run deterministic tests
        run: npm run test:part${{ matrix.shard }}

  # The product's platform: macOS arm64 with the system Python 3.9 that hooks run.
  test-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the system Python 3.9
        run: |
          version="$(/usr/bin/python3 --version)"
          echo "$version"
          case "$version" in
            "Python 3.9."*) ;;
            *) echo "/usr/bin/python3 is not Python 3.9" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/system-python"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/system-python/python3"
          echo "$RUNNER_TEMP/system-python" >> "$GITHUB_PATH"
      - name: Verify runtime prerequisites
        run: |
          uname -m
          node --version
          python3 --version
          test "$(python3 -c 'import sys; print(sys.version_info[:2])')" = "(3, 9)"
          bash --version
      - name: Run deterministic tests
        run: npm run test:part${{ matrix.shard }}
