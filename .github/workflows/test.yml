name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24, 26]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify runtime prerequisites
        run: |
          node --version
          python3 --version
          bash --version
      - name: Run deterministic tests
        run: npm test -- --test-shard=${{ matrix.shard }}/3
